name = "history"
compatibility_date = "2026-05-10"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[assets]
directory = "dist"
not_found_handling = "single-page-application"

[build]
command = "bun install --frozen-lockfile && bun run build"
cwd = "."

[build.upload]
format = "service-worker"

[env.production]
vars = { VITE_MAPBOX_TOKEN = "" }
